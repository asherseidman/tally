name: Release build

# A tag push (v*) builds Tally.app and publishes a GitHub Release.
# A manual run ("Run workflow" in the Actions tab) only builds and keeps the zip as a workflow artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only everywhere by default. Only the release job below is granted write access.
permissions:
  contents: read

# Two runs for the same tag (or the same branch) never overlap.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Tally.app (arm64)
    # macos-latest is macOS 26 on Apple Silicon (arm64); see the runner-images README.
    runs-on: macos-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Check this is an Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64" || { echo "Expected arm64, got $(uname -m)"; exit 1; }
          sw_vers

      - name: Read the version from package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Download the Electron binary (npm blocks its install script)
        run: node node_modules/electron/install.js

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build the app
        run: npm run build

      - name: Confirm the app was built
        run: |
          test -d release/mac-arm64/Tally.app || { echo "release/mac-arm64/Tally.app is missing"; exit 1; }
          lipo -archs release/mac-arm64/Tally.app/Contents/MacOS/Tally

      - name: Zip the app and write the checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-release
          zip="dist-release/Tally-${VERSION}-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Tally.app "$zip"
          (cd dist-release && shasum -a 256 "Tally-${VERSION}-arm64.zip" > "Tally-${VERSION}-arm64.zip.sha256")
          ls -l dist-release
          cat "$zip.sha256"

      - name: Fail if the zip contains personal or secret files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="dist-release/Tally-${VERSION}-arm64.zip"
          unzip -Z1 "$zip" > dist-release/zip-listing.txt
          echo "$(wc -l < dist-release/zip-listing.txt) entries in the zip"
          if grep -Ei 'google-client|\.db$|\.db-(wal|shm)$|(^|/)\.env($|\.)|(^|/)imports/' dist-release/zip-listing.txt; then
            echo "Forbidden file(s) found in the zip (listed above)."
            exit 1
          fi
          echo "No google-client, .db, .env or imports/ entries."
          rm dist-release/zip-listing.txt

      - name: Upload the zip and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tally-${{ steps.version.outputs.version }}-arm64
          path: |
            dist-release/Tally-${{ steps.version.outputs.version }}-arm64.zip
            dist-release/Tally-${{ steps.version.outputs.version }}-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    # Only a tag push publishes. A manual run stops after the build job.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tally-${{ needs.build.outputs.version }}-arm64
          path: dist-release

      - name: Check the checksum again
        working-directory: dist-release
        run: sha256sum -c "Tally-${{ needs.build.outputs.version }}-arm64.zip.sha256"

      - name: Create the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Tally ${{ needs.build.outputs.version }}
          generate_release_notes: true
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            dist-release/Tally-${{ needs.build.outputs.version }}-arm64.zip
            dist-release/Tally-${{ needs.build.outputs.version }}-arm64.zip.sha256
